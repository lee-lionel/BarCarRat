<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Car Rat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Name entry -->
    <div id="inputBox">
        <div class="panel">
            <p class="brand">🍻🚘🐀</p>
            <h1 class="panel-title">Bar Car Rat</h1>
            <p class="panel-sub">Baccarat, but with worse decisions.</p>
            <label class="field-label" for="playerInput">Please choose a name</label>
            <input type="text" id="playerInput" onkeydown="checkEnter(event)" autocomplete="off" placeholder="Your name" maxlength="20">
            <p class="hint" id="nameHint">Press <kbd>Enter</kbd> to take a seat</p>
        </div>
    </div>

    <!-- Table -->
    <div id="gameContainer">
        <div class="table">
            <header class="table-top">
                <div class="seat">
                    <span class="bank-label">Seat</span>
                    <div id="playerId"></div>
                </div>
                <p class="brand brand-sm">🍻🚘🐀</p>
                <div class="bank">
                    <span class="bank-label">Bank Balance</span>
                    <div id="bankBalance"></div>
                </div>
            </header>

            <section class="hand-area" id="bankerArea">
                <h2 class="header">Banker <span class="total" id="bankerTotal"></span></h2>
                <div id="computerHand" class="hand"></div>
            </section>

            <div class="table-divider" aria-hidden="true"></div>

            <section class="hand-area" id="punterArea">
                <h2 class="header">Player <span class="total" id="playerTotal"></span></h2>
                <div id="playerHand" class="hand"></div>
            </section>

            <p class="backing" id="backing"></p>

            <!-- Your move. The banker still plays by the book. -->
            <div id="controlPanel">
                <button class="controlButtons" id="hit">Hit</button>
                <button class="controlButtons" id="stand">Stand</button>
            </div>
            <p class="advice" id="advice"></p>

            <!-- Calls the hand before it's turned over, e.g. a natural. -->
            <div id="announce" aria-live="polite"></div>
        </div>
    </div>

    <!-- Betting -->
    <div id="wagerContainer">
        <div class="panel">
            <h3 class="panel-title">Place your bet</h3>
            <p class="panel-sub">Back a hand, then stake a chip. You play the Player hand; the banker plays by the book.</p>

            <div class="sides" role="radiogroup" aria-label="Which hand to back">
                <button class="sideButton" data-side="player" role="radio" aria-checked="true">
                    Player <span class="odds">pays 1 : 1</span>
                </button>
                <button class="sideButton" data-side="banker" role="radio" aria-checked="false">
                    Banker <span class="odds">pays 1 : 1 less 5%</span>
                </button>
                <button class="sideButton" data-side="tie" role="radio" aria-checked="false">
                    Tie <span class="odds">pays 8 : 1</span>
                </button>
            </div>

            <div class="chips">
                <button class='wagerButtons' id="5">5</button>
                <button class='wagerButtons' id="10">10</button>
                <button class='wagerButtons' id="15">15</button>
                <button class='wagerButtons' id="20">20</button>
            </div>
            <p class="hint">Balance: <span id="wagerBalance"></span></p>
        </div>
    </div>

    <!-- Out of chips -->
    <div id="gameOver">
        <h1>Out of chips</h1>
        <p class="panel-sub">Your balance reached zero.</p>
        <button id="playAgain">Play again</button>
    </div>

    <!-- Round result -->
    <div id="endState">
        <h1>Result: You <span id="result"></span></h1>
        <p class="panel-sub" id="resultDetail"></p>
        <button id="continueGame">Continue</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
