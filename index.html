<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacarrat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Name entry -->
    <div id="inputBox">
        <div class="panel">
            <p class="brand">🍻🚘🐀</p>
            <h1 class="panel-title">Bar Car Rat</h1>
            <p class="panel-sub">Baccarat, but with worse decisions.</p>
            <label class="field-label" for="playerInput">Please choose a name</label>
            <input type="text" id="playerInput" onkeydown="checkEnter(event)" autocomplete="off" placeholder="Your name" maxlength="20">
            <p class="hint" id="nameHint">Press <kbd>Enter</kbd> to take a seat</p>
        </div>
    </div>

    <!-- Table -->
    <div id="gameContainer">
        <div class="table">
            <header class="table-top">
                <p class="brand brand-sm">🍻🚘🐀</p>
                <div class="bank">
                    <span class="bank-label">Bank Balance</span>
                    <div id="bankBalance"></div>
                </div>
            </header>

            <section class="hand-area">
                <h2 class="header">Computer</h2>
                <div id="computerHand" class="hand"></div>
            </section>

            <div class="table-divider" aria-hidden="true"></div>

            <section class="hand-area">
                <h2 id="playerId" class="header"></h2>
                <div id="playerHand" class="hand"></div>
            </section>

            <div id="controlPanel">
                <button class="controlButtons" id="hit">Hit</button>
                <button class="controlButtons" id="stand">Stand</button>
            </div>
        </div>
    </div>

    <!-- Betting -->
    <div id="wagerContainer">
        <div class="panel">
            <h3 class="panel-title">Place your bets</h3>
            <p class="panel-sub">Pick your chip to deal the next round.</p>
            <div class="chips">
                <button class='wagerButtons' id="5">5</button>
                <button class='wagerButtons' id="10">10</button>
                <button class='wagerButtons' id="15">15</button>
                <button class='wagerButtons' id="20">20</button>
            </div>
            <p class="hint">Balance: <span id="wagerBalance"></span></p>
        </div>
    </div>

    <!-- Out of chips -->
    <div id="gameOver">
        <h1>Out of chips</h1>
        <p class="panel-sub">Your balance reached zero.</p>
        <button id="playAgain">Play again</button>
    </div>

    <!-- Round result -->
    <div id="endState">
        <h1>Result: You <span id="result"></span></h1>
        <button id="continueGame">Continue</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
